<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Yasir Broast</title>
    <link rel="stylesheet" href="yasir broast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="order-page">

    <!-- ===== ANIMATED BACKGROUND (Uses Image 3 - Spices & Curries) ===== -->
    <div class="animated-bg" style="
        background-image: https://WhatsApp Image 2026-09-22.jpeg;
        animation: kenBurns 25s ease-in-out infinite alternate;
    "></div>
    <div class="warm-glow"></div>

    <!-- Floating food particles for order page -->
    <div class="food-particle" style="top:15%; left:8%; animation-delay:0s;">🍗</div>
    <div class="food-particle" style="top:65%; left:90%; animation-delay:-2s;">🍔</div>
    <div class="food-particle" style="top:40%; left:85%; animation-delay:-4s;">🍕</div>
    <div class="food-particle" style="top:80%; left:15%; animation-delay:-6s;">🍛</div>
    <div class="food-particle" style="top:25%; left:70%; animation-delay:-3s;">🌶️</div>

    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="logo">
                <i class="fas fa-drumstick-bite"></i>
                <div>
                    <h1>YASIR BROAST</h1>
                    <span>SHAHDARA</span>
                </div>
            </div>
            <nav>
                <ul>
                    <li><a href="yasir broast.html">Home</a></li>
                    <li><a href="yasir broast.html#menu">Menu</a></li>
                    <li><a href="yasir broast order.html" style="color: var(--primary-color);">Order Online</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Order Section -->
    <section class="container order-container">

        <!-- Left Side: Menu Items -->
        <div class="order-menu-section">
            <h2><i class="fas fa-utensils"></i> Select Items</h2>
            <div id="order-menu-container">
                <!-- Items loaded by JS -->
            </div>
        </div>

        <!-- Right Side: Cart & Address -->
        <div class="order-summary">
            <h2><i class="fas fa-shopping-cart"></i> Your Order</h2>
            <div class="summary-box">

                <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--primary-color);">
                    <i class="fas fa-map-marker-alt"></i> Delivery Address
                </h3>
                <textarea id="address" class="address-input" placeholder="Enter your complete address here..."></textarea>

                <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--primary-color);">
                    <i class="fas fa-receipt"></i> Order Summary
                </h3>
                <ul class="cart-items" id="cart-items">
                    <!-- Cart items loaded by JS -->
                </ul>

                <div class="total-section">
                    <span>Total:</span>
                    <span class="total-price" id="total-price">PKR 0</span>
                </div>

                <button class="place-order-btn" onclick="placeOrder()">
                    <i class="fas fa-check-circle"></i> Place Order
                </button>
            </div>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-info">
                <h3>Yasir Broast</h3>
                <p><i class="fas fa-map-marker-alt"></i> Shahdara, Lahore</p>
                <p><i class="fas fa-envelope"></i> yasirbroast@gmail.com</p>
                <p><i class="fas fa-phone"></i> 03*******23</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Yasir Broast. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="yasir broast.js"></script>
</body>
</html>
